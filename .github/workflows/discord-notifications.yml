name: Discord Notifications
on:
  push:
  create:
  delete:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft, assigned, unassigned, labeled, unlabeled, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, reopened, edited, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned, pinned, unpinned, transferred]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, answered, unanswered, category_changed, labeled, unlabeled, locked, unlocked, pinned, unpinned, transferred]
  discussion_comment:
    types: [created, edited, deleted]
  release:
    types: [published]
  fork:
  watch:
    types: [started]
  label:
    types: [created, edited, deleted]
  milestone:
    types: [created, opened, edited, closed, deleted]
  deployment:
  deployment_status:
  status:
  check_run:
    types: [created, completed, rerequested, requested_action]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Announce an existing published release, or leave blank for a connection preview
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out notification script
        uses: actions/checkout@v7
      - name: Load published release for a manual announcement
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected a stable release tag such as v68.5.29.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{action: "published", release: ., sender: .author}' > "$RUNNER_TEMP/release-event.json"
          python3 -c 'import json,sys; release=json.load(open(sys.argv[1]))["release"]; sys.exit(0 if release.get("published_at") and not release.get("draft") else "Release is not published")' "$RUNNER_TEMP/release-event.json"
          echo "event_path=$RUNNER_TEMP/release-event.json" >> "$GITHUB_OUTPUT"
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_EVENT_NAME: ${{ steps.release.outputs.event_path != '' && 'release' || github.event_name }}
          NOTIFICATION_EVENT_ACTION: ${{ steps.release.outputs.event_path != '' && 'published' || github.event.action }}
          NOTIFICATION_EVENT_PATH: ${{ steps.release.outputs.event_path || github.event_path }}
        run: python3 .github/scripts/discord_notify.py
