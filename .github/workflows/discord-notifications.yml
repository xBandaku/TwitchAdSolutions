name: Discord Notifications
on:
  push:
  create:
  delete:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft, assigned, unassigned, labeled, unlabeled, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, reopened, edited, closed, assigned, unassigned, labeled, unlabeled, milestoned, demilestoned, pinned, unpinned, transferred]
  issue_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, answered, unanswered, category_changed, labeled, unlabeled, locked, unlocked, pinned, unpinned, transferred]
  discussion_comment:
    types: [created, edited, deleted]
  release:
    types: [published, unpublished, created, edited, deleted, prereleased, released]
  fork:
  watch:
    types: [started]
  label:
    types: [created, edited, deleted]
  milestone:
    types: [created, opened, edited, closed, deleted]
  deployment:
  deployment_status:
  status:
  check_run:
    types: [created, completed, rerequested, requested_action]
  check_suite:
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out notification script
        uses: actions/checkout@v4
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/discord_notify.py
