name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without creating a tag or publishing a release
        type: boolean
        default: true

# Read-only by default. Only the publish job, which runs no project code or
# npm dependencies, receives write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    - name: Install test dependencies
      run: npm ci --ignore-scripts

    - name: Lint source and compile notification script
      run: |
        npm run lint
        python -m compileall -q .github
        python -m unittest discover -s .github/scripts -p "test_*.py" -v

    - name: Validate workflows
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/lint-workflows.sh

    - name: Run unit tests
      run: npm test

    - name: Install browser dependencies
      run: npx playwright install --with-deps

    - name: Run browser recovery and worker tests
      run: npm run test:browser

    - name: Package installable scripts and checksums
      run: npm run test:package

    - name: Prepare release notes
      id: release
      shell: bash
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const script = fs.readFileSync('vaft/vaft.user.js', 'utf8').replace(/\r\n/g, '\n');
        const version = /^\/\/ @version[ \t]+(\d+\.\d+\.\d+)[ \t]*$/m.exec(script)?.[1];
        if (!version) throw new Error('Expected a stable x.y.z @version in vaft/vaft.user.js');
        const sections = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split(/^## /m).slice(1).map(section => {
          const [heading, ...body] = section.split('\n');
          return { heading: heading.trim(), body: body.join('\n').trim() };
        });
        const notes = sections.find(section => section.heading === 'v' + version || section.heading.startsWith('v' + version + ' '))
          ?? sections.find(section => section.heading === 'Unreleased');
        if (!notes?.body) throw new Error('No release notes found for vaft ' + version);
        fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), notes.body + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
        console.log('Prepared release notes for vaft ' + version);
        NODE

    - name: Build and verify release bundle
      env:
        VERSION: ${{ steps.release.outputs.version }}
        RELEASE_DIR: release-artifact
      run: |
        python <<'PY'
        import hashlib
        import os
        import re
        import zipfile
        from pathlib import Path

        version = os.environ['VERSION']
        if not re.fullmatch(r'\d+\.\d+\.\d+', version):
            raise ValueError('Expected a stable release version')
        root = Path(os.environ['RELEASE_DIR']).resolve()
        manifest = (root / 'SHA256SUMS').read_bytes()
        entries = {}
        for line in manifest.decode('utf-8').splitlines():
            digest, name = line.split('  ', 1)
            source = (root / name).resolve()
            source.relative_to(root)
            payload = source.read_bytes()
            if hashlib.sha256(payload).hexdigest() != digest:
                raise ValueError('Checksum mismatch: ' + name)
            if name in entries:
                raise ValueError('Duplicate bundle entry: ' + name)
            entries[name] = payload
        if not entries:
            raise ValueError('Release manifest is empty')
        entries['SHA256SUMS'] = manifest
        archive = root / ('TwitchAdSolutions-v' + version + '.zip')
        with zipfile.ZipFile(archive, 'w') as bundle:
            for name, payload in entries.items():
                entry = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                entry.compress_type = zipfile.ZIP_DEFLATED
                entry.external_attr = 0o100644 << 16
                bundle.writestr(entry, payload)
        with zipfile.ZipFile(archive) as bundle:
            for name, payload in entries.items():
                if bundle.read(name) != payload:
                    raise ValueError('Bundle verification failed: ' + name)
        print('Verified ' + str(len(entries)) + ' release bundle entries')
        PY

    - name: Stage release notes for the publish job
      run: cp "$RUNNER_TEMP/release-notes.md" release-artifact/release-notes.md

    - name: Summarize dry run
      if: ${{ inputs.dry_run }}
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        {
          echo "Dry run for v$VERSION. No tag or release was created."
          echo
          echo 'Assets: vaft.user.js, vaft-ublock-origin.js, script bundle, SHA256SUMS'
          echo
          cat "$RUNNER_TEMP/release-notes.md"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload release preview
      if: ${{ inputs.dry_run }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-preview-${{ steps.release.outputs.version }}
        path: release-artifact/
        if-no-files-found: error
        retention-days: 7

    - name: Upload verified release files
      if: ${{ inputs.dry_run == false }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-files
        path: release-artifact/
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish release
    needs: build
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    # History only, for the tag check below. No project code or dependencies run in this job.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download verified release files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-files
        path: release-artifact/

    - name: Read release version
      id: release
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::Build job did not report a stable version.'
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Check publish target
      if: ${{ !inputs.dry_run }}
      env:
        TAG: v${{ steps.release.outputs.version }}
      run: |
        if [[ "$GITHUB_REF" != refs/heads/master ]]; then
          echo '::error::Release publishing requires the master branch.'
          exit 1
        fi
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
          echo "::error::Tag $TAG already exists. Bump the userscript version before publishing."
          exit 1
        fi

    - name: Publish release
      if: ${{ !inputs.dry_run }}
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: v${{ steps.release.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: Release v${{ steps.release.outputs.version }}
        body_path: release-artifact/release-notes.md
        files: |
          release-artifact/vaft/vaft.user.js
          release-artifact/vaft/vaft-ublock-origin.js
          release-artifact/TwitchAdSolutions-v${{ steps.release.outputs.version }}.zip
          release-artifact/SHA256SUMS
        fail_on_unmatched_files: true
        overwrite_files: false
        make_latest: true
        draft: false
        prerelease: false

  announce:
    name: Announce release
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # GITHUB_TOKEN releases do not trigger the separate release event workflow.
    - name: Announce published release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        TAG: v${{ needs.build.outputs.version }}
        NOTIFICATION_EVENT_NAME: release
        NOTIFICATION_EVENT_ACTION: published
      run: |
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{action: "published", release: ., sender: .author}' > "$RUNNER_TEMP/release-event.json"
        NOTIFICATION_EVENT_PATH="$RUNNER_TEMP/release-event.json" python3 .github/scripts/discord_notify.py
