name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without creating a tag or publishing a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install acorn
      run: npm install -g acorn@8.19.0

    - name: Validate JavaScript
      shell: bash
      run: |
        git ls-files -z '*.js' | while IFS= read -r -d '' script; do
          echo "Validating $script"
          case "$script" in
            *ublock-origin*.js) tail -n +2 "$script" | acorn --ecma2022 > /dev/null ;;
            *) acorn --ecma2022 "$script" > /dev/null ;;
          esac
        done

    - name: Run unit tests
      run: node tests/test.js

    - name: Prepare release notes
      id: release
      shell: bash
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        const script = fs.readFileSync('vaft/vaft.user.js', 'utf8').replace(/\r\n/g, '\n');
        const version = /^\/\/ @version[ \t]+(\d+\.\d+\.\d+)[ \t]*$/m.exec(script)?.[1];
        if (!version) throw new Error('Expected a stable x.y.z @version in vaft/vaft.user.js');
        const sections = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n').split(/^## /m).slice(1).map(section => {
          const [heading, ...body] = section.split('\n');
          return { heading: heading.trim(), body: body.join('\n').trim() };
        });
        const notes = sections.find(section => section.heading === 'v' + version || section.heading.startsWith('v' + version + ' '))
          ?? sections.find(section => section.heading === 'Unreleased');
        if (!notes?.body) throw new Error('No release notes found for vaft ' + version);
        fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), notes.body + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
        console.log('Prepared release notes for vaft ' + version);
        NODE

    - name: Summarize dry run
      if: ${{ inputs.dry_run }}
      env:
        VERSION: ${{ steps.release.outputs.version }}
      run: |
        {
          echo "Dry run for v$VERSION. No tag or release was created."
          echo
          echo 'Asset: vaft/vaft.user.js'
          echo
          cat "$RUNNER_TEMP/release-notes.md"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check publish target
      if: ${{ !inputs.dry_run }}
      env:
        TAG: v${{ steps.release.outputs.version }}
      run: |
        if [[ "$GITHUB_REF" != refs/heads/master ]]; then
          echo '::error::Release publishing requires the master branch.'
          exit 1
        fi
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
          echo "::error::Tag $TAG already exists. Bump the userscript version before publishing."
          exit 1
        fi

    - name: Publish release
      if: ${{ !inputs.dry_run }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.release.outputs.version }}
        target_commitish: ${{ github.sha }}
        name: Release v${{ steps.release.outputs.version }}
        body_path: ${{ runner.temp }}/release-notes.md
        files: vaft/vaft.user.js
        fail_on_unmatched_files: true
        overwrite_files: false
        make_latest: true
        draft: false
        prerelease: false
