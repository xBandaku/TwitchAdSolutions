name: Validate JS

on:
  push:
    paths:
      - "**/*.js"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.js"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install acorn
      run: npm install -g acorn@8.19.0

    - name: Validate JavaScript
      shell: bash
      run: |
        git ls-files -z '*.js' | while IFS= read -r -d '' script; do
          echo "Validating $script"
          case "$script" in
            *ublock-origin*.js) tail -n +2 "$script" | acorn --ecma2022 > /dev/null ;;
            *) acorn --ecma2022 "$script" > /dev/null ;;
          esac
        done

    - name: Run unit tests
      run: node tests/test.js
