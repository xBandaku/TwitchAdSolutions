name: Project checks

on:
  push:
    branches: [master]
    paths:
      - "**/*.js"
      - "CHANGELOG.md"
      - ".github/**"
      - "package*.json"
      - "eslint-suppressions.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: npm

    - name: Install test dependencies
      run: npm ci --ignore-scripts

    - name: Test runtime regressions, metadata, syntax, and paired scripts
      run: npm test

    - name: Verify installable artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      run: npm run test:package

    - name: Upload installable artifacts and checksums
      if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      uses: actions/upload-artifact@v7
      with:
        name: scripts-${{ github.sha }}
        path: release-artifact/
        if-no-files-found: error
        retention-days: 7

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - name: Validate every workflow with actionlint
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/lint-workflows.sh

  lint:
    name: Source lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run lint
    - run: python -m compileall -q .github

  browser:
    name: ${{ matrix.browser }} fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci --ignore-scripts
    - name: Install browser and system dependencies
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run offline Twitch fixtures
      run: npm run test:browser -- --project=${{ matrix.browser }}
    - name: Upload browser reports and failure traces
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: browser-results-${{ matrix.browser }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: error
        retention-days: 7

  release-tests:
    name: release-tests
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Require the matrix containing release tests to pass
      env:
        RESULT: ${{ needs.validate.result }}
      run: test "$RESULT" = success
